<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Common Ground</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--panel2:#18223a;--line:#2a3654;--text:#edf2ff;--muted:#8f9bb5;--accent:#8fa8ff;--gpt:#7AA7FF;--ziv:#B38CFF;--liu:#FFD6A5;--ok:#39d37e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(22,32,62,.32) 0,transparent 38%),radial-gradient(circle at 85% 100%,rgba(70,54,110,.22) 0,transparent 42%),#0b1020;color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystem,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
.app{height:100%;display:flex}
.sidebar{width:280px;border-right:1px solid var(--line);background:rgba(10,15,29,.85);padding:18px;display:flex;flex-direction:column;min-width:0;transform:translateX(-100%);transition:transform .22s ease;position:fixed;left:0;top:0;bottom:0;z-index:40}
.sidebar.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(4,8,18,.5);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.brand{font-size:20px;font-weight:750;letter-spacing:.5px;background:linear-gradient(135deg,#8fa8ff,#b38cff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px}
.new{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:11px 12px;cursor:pointer;font-weight:600;transition:border-color .15s,background .15s}
.new:hover{border-color:var(--accent);background:var(--panel2)}
.threads{margin-top:14px;overflow:auto}
.thread{padding:12px;border-radius:11px;margin-bottom:6px;cursor:pointer;color:#cbd4ea;transition:background .15s}
.thread:hover{background:var(--panel2)}
.thread.active{background:linear-gradient(90deg,rgba(143,168,255,.14),transparent);color:#fff}
.thread small{display:block;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{min-width:0;flex:1;display:grid;grid-template-rows:auto 1fr auto;background:rgba(11,16,32,.42)}
.header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;backdrop-filter:blur(8px)}
.menuBtn{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:6px 10px;border-radius:8px}
.menuBtn:hover{color:var(--text);background:var(--panel)}
.title{font-weight:650;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.status{font-size:11px;color:var(--muted);background:rgba(57,211,126,.12);border:1px solid rgba(57,211,126,.25);padding:2px 9px;border-radius:20px}
.messages{padding:20px;overflow:auto;display:flex;flex-direction:column;gap:13px;overscroll-behavior:contain;scroll-behavior:smooth}
.empty{margin:auto;color:var(--muted);text-align:center;padding:40px}
.empty small{display:block;color:var(--muted);margin-top:8px;font-size:12px}
.msg{display:flex;gap:9px;max-width:min(780px,90%);padding:11px 14px;border:1px solid var(--line);border-radius:16px;background:rgba(26,41,64,.5);align-items:flex-start}
.msg .avatar{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 10px rgba(0,0,0,.25)}
.msg .body{flex:1;min-width:0}
.msg .meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.msg.user{align-self:flex-end;margin-left:auto;flex-direction:row-reverse;background:rgba(24,34,58,.55)}
.msg.user .avatar{border-color:transparent}
.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.reply{font-size:11px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;margin-bottom:6px;background:rgba(143,155,181,.06);border-radius:6px}
.mBadge{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;font-weight:600;margin:0 1px;line-height:1.5}
.mBadge.gpt{background:rgba(122,167,255,.16);color:var(--gpt)}
.mBadge.ziven{background:rgba(179,140,255,.16);color:var(--ziv)}
.mBadge.all{background:rgba(143,168,255,.14);color:var(--muted)}
.notice{padding:9px 18px;color:#f0c98a;font-size:12px;display:none;border-top:1px solid var(--line)}
.composer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;background:rgba(10,15,29,.88);position:sticky;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
textarea{flex:1;resize:none;min-height:46px;max-height:130px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:12px 13px;font:inherit;outline:none;transition:border-color .15s;overscroll-behavior:contain}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(143,168,255,.12)}
button.send{border:0;border-radius:12px;background:linear-gradient(135deg,#7aa7ff,#b38cff);color:#081022;padding:0 20px;font-weight:750;cursor:pointer;transition:transform .12s,box-shadow .12s;min-height:46px}
button.send:hover{box-shadow:0 0 14px rgba(143,168,255,.35)}
button.send:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
.quickBar{display:none;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 58px);left:16px;right:16px;z-index:30}
.quickBar.show{display:flex}
.quickBar .q{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;border:1px solid var(--line);background:rgba(18,26,45,.9);border-radius:12px;color:var(--muted);cursor:pointer;min-height:48px;font-size:12px;backdrop-filter:blur(10px)}
.quickBar .q b{font-size:13px}
.mDropdown{position:absolute;z-index:50;min-width:240px;max-width:calc(100% - 24px);max-height:240px;overflow:auto;border:1px solid var(--line);background:rgba(18,26,45,.94);border-radius:16px;box-shadow:0 8px 26px rgba(0,0,0,.45);backdrop-filter:blur(12px);opacity:0;transform:translateY(8px) scale(.98);transition:opacity .1s,transform .1s;pointer-events:none;padding:6px}
.mDropdown.show{opacity:1;transform:none;pointer-events:auto}
.mDropdown .mItem{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;cursor:pointer;min-height:44px}
.mDropdown .mItem:hover,.mDropdown .mItem.sel{background:rgba(143,168,255,.14)}
.mDropdown .mItem .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.mDropdown .mItem .nm{flex:1;min-width:0}
.mDropdown .mItem .nm b{display:block;font-size:14px;color:var(--text)}
.mDropdown .mItem .nm small{display:block;color:var(--muted);font-size:11px}
@media(max-width:720px){.messages{padding:14px}.header{padding:12px 14px}.composer{padding:10px 14px}.quickBar .q{min-height:48px}}
@media(max-width:380px){.msg{max-width:96%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">Common Ground</div><button class="new" id="newThread">＋ 新线程</button><div class="threads" id="threads"><div class="empty">加载中…</div></div></aside>
<div class="scrim" id="scrim"></div>
<main class="main">
<header class="header"><button class="menuBtn" id="menuBtn" title="线程列表">☰</button><div class="title" id="threadTitle">选择一个线程</div><div class="status" id="status">执勤中</div></header>
<section class="messages" id="messages"><div class="empty">选择或创建一个 Thread<small>在这里与 GPT、Ziven 共同协作</small></div></section>
<div class="notice" id="notice"></div>
<div class="quickBar" id="quickBar"></div>
<div class="mDropdown" id="mDropdown"></div>
<form class="composer" id="composer"><textarea id="input" placeholder="输入消息… 用 @ 提醒协作者" disabled></textarea><button class="send" type="submit" disabled>发送</button></form>
</main>
</div>
<script>
const API={threads:'/api/chat/threads',messages:id=>`/api/chat/threads/${encodeURIComponent(id)}/messages`};
const MENTIONS=[{id:'gpt',name:'GPT',sub:'思考协作者',av:'✦',color:'#7AA7FF',cls:'gpt'},{id:'ziven',name:'Ziven',sub:'执行协作者',av:'✧',color:'#B38CFF',cls:'ziven'},{id:'all',name:'全体',sub:'通知全部',av:'◎',color:'#8FA8FF',cls:'all'}];
let currentThread=null,isComposing=false,mention=null;
const $=id=>document.getElementById(id);
function notice(t){const n=$('notice');n.textContent=t;n.style.display=t?'block':'none'}
async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers || {})},...options});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.status===204?null:r.json()}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function actor(a){const m={liuliu:{name:'柳柳',color:'#FFD6A5',av:'☀'},gpt:{name:'GPT',color:'#7AA7FF',av:'✦'},ziven:{name:'Ziven',color:'#B38CFF',av:'✧'}}[a];return m||{name:a,color:'#8FA8FF',av:a[0]||'?'}}
function renderMentions(text){let s=esc(text);for(const m of MENTIONS){s=s.replace(new RegExp('@'+m.name+'\\b','g'),`<span class="mBadge ${m.cls}">@${m.name}</span>`)}return s}
function avatar(a){const x=actor(a);return `<span class="avatar" style="background:${x.color}">${x.av}</span>`}
function renderThreads(items){const box=$('threads');box.innerHTML='';if(!items?.length){box.innerHTML='<div class="empty">还没有线程</div>';return}for(const t of items){const el=document.createElement('div');el.className='thread'+(t.thread_id===currentThread?' active':'');el.innerHTML=`<div>${esc(t.title||'未命名')}</div><small>${esc(t.status||'active')}</small>`;el.onclick=()=>{selectThread(t.thread_id,t.title);closeSidebar()};box.appendChild(el)}}
function renderMessages(items){const box=$('messages');box.innerHTML='';if(!items?.length){box.innerHTML='<div class="empty">还没有消息<small>说点什么开始吧</small></div>';return}for(const m of items){const isUser=m.author==='liuliu';const el=document.createElement('article');el.className='msg'+(isUser?' user':'');const reply=m.reply_to?`<div class="reply">回复：${esc(String(m.reply_to).slice(0,10))}…</div>`:'';el.innerHTML=`${avatar(m.author)}<div class="body">${reply}<div class="meta">${esc(actor(m.author).name)}&#183;${new Date(m.created_at).toLocaleString()}</div><div class="content">${renderMentions(m.content)}</div></div>`;box.appendChild(el)}box.scrollTop=box.scrollHeight}
async function loadThreads(){try{const data=await api(API.threads);const items=Array.isArray(data)?data:(data.threads||data.data||[]);renderThreads(items);if(!currentThread&&items[0])selectThread(items[0].thread_id,items[0].title)}catch(e){notice('线程加载失败：'+e.message)}}
async function selectThread(id,title){currentThread=id;$('threadTitle').textContent=title||'未命名';$('input').disabled=false;$('composer button').disabled=false;loadThreads().catch(()=>{});try{const data=await api(API.messages(id));const items=Array.isArray(data)?data:(data.messages||data.data||[]);renderMessages(items);notice('')}catch(e){renderMessages([]);notice('消息加载失败：'+e.message)}}
function openSidebar(){$('sidebar').classList.add('open');$('scrim').classList.add('show')}
function closeSidebar(){$('sidebar').classList.remove('open');$('scrim').classList.remove('show')}
$('menuBtn').onclick=()=>$('sidebar').classList.contains('open')?closeSidebar():openSidebar();
$('scrim').onclick=closeSidebar;
$('newThread').onclick=async()=>{const title=prompt('线程标题：','新线程');if(title===null)return;try{const t=await api(API.threads,{method:'POST',body:JSON.stringify({title:title.trim()||'未命名',creator:'liuliu'})});await loadThreads();selectThread(t.thread_id,t.title);closeSidebar()}catch(e){notice('创建失败：'+e.message)}};
/* ===== Mention UX ===== */
const input=$('input');
function curToken(){const val=input.value,pos=input.selectionStart;const before=val.slice(0,pos);const m=before.match(/(?:^|\s)@([\w\u4e00-\u9fa5]*)$/);return m?{start:pos-m[0].length,token:m[1]}:null}
function showMention(token){const q=token.toLowerCase();const list=MENTIONS.filter(x=>x.id.includes(q)||x.name.toLowerCase().includes(q));if(!list.length){hideMention();return}mention={list,sel:0,token};renderMentionBox();const bar=$('quickBar');bar.innerHTML=list.map(x=>`<div class="q" data-id="${x.id}"><b><span style="color:${x.color}">${x.av}</span> @${x.name}</b>${x.sub}</div>`).join('');bar.classList.add('show');const drop=$('mDropdown');positionDrop(drop);drop.classList.add('show')}
function hideMention(){mention=null;$('quickBar').innerHTML='';$('quickBar').classList.remove('show');$('mDropdown').classList.remove('show')}
function renderMentionBox(){$('mDropdown').innerHTML=mention.list.map((x,i)=>`<div class="mItem${i===mention.sel?' sel':''}" data-id="${x.id}"><span class="av" style="background:${x.color}">${x.av}</span><span class="nm"><b>@${x.name}</b><small>${x.sub}</small></span></div>`).join('')}
function positionDrop(el){const c=$('composer');const r=c.getBoundingClientRect();const spaceAbove=r.top;const h=Math.min(240,el.scrollHeight||200);if(spaceAbove>h+10){el.style.bottom=(window.innerHeight-r.top+8)+'px';el.style.top='auto'}else{el.style.top=(r.bottom+8)+'px';el.style.bottom='auto'}el.style.left='16px';el.style.right='auto'}
function chooseMention(id){const t=MENTIONS.find(x=>x.id===id);if(!t)return;const tk=curToken();const val=input.value,pos=input.selectionStart;const start=tk?tk.start:pos;const ins='@'+t.name+' ';input.value=val.slice(0,start)+ins+val.slice(pos);const np=start+ins.length;input.selectionStart=input.selectionEnd=np;hideMention();input.focus()}
input.addEventListener('input',()=>{if(!isComposing)checkMention()});
input.addEventListener('compositionstart',()=>{isComposing=true;hideMention()});
input.addEventListener('compositionend',()=>{isComposing=false;checkMention()});
input.addEventListener('blur',()=>setTimeout(hideMention,150));
function checkMention(){if(input.disabled){hideMention();return}const tk=curToken();if(tk){showMention(tk.token)}else{hideMention()}}
input.addEventListener('keydown',e=>{if(mention){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();mention.sel=(mention.sel+(e.key==='ArrowDown'?1:-1)+mention.list.length)%mention.list.length;renderMentionBox();return}if(e.key==='Enter'){e.preventDefault();chooseMention(mention.list[mention.sel].id);return}if(e.key==='Escape'){e.preventDefault();hideMention();input.blur();return}}});
$('mDropdown').onmousedown=e=>{const el=e.target.closest?.('.mItem');const id=el?.dataset?.id;if(id){e.preventDefault();chooseMention(id)}};
$('quickBar').onclick=e=>{const el=e.target.closest?.('.q');const id=el?.dataset?.id;if(id)chooseMention(id)};
$('composer').onsubmit=async e=>{e.preventDefault();if(!currentThread)return;const content=input.value.trim();if(!content)return;input.disabled=true;$('composer button').disabled=true;hideMention();try{await api(API.messages(currentThread),{method:'POST',body:JSON.stringify({author:'liuliu',content})});input.value='';await selectThread(currentThread,$('threadTitle').textContent)}catch(err){notice('发送失败：'+err.message)}finally{input.disabled=false;$('composer button').disabled=false;input.focus()}};
loadThreads();
</script>
</body>
</html>
